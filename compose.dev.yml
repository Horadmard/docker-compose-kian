services:

  nginx-proxy:
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      
  backend:
    volumes:
      - ./backend:/app/backend
    environment:
      DEBUG: "true"

  frontend:
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      NODE_ENV: development
